# Two services: backend API on 5000, frontend (nginx) on 80
services:
  backend:
    build: ./server
    container_name: backend
    restart: always
    env_file:
      - ./server/.env        
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: frontend
    restart: always
    environment:
      VITE_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend